# kUPS reference run for the RUBTAK/CO2 Widom insertion, matched to the PureAdsorb case in
# test/reference_tests.jl: RUBTAK 3x3x3, CO2, 298.15 K, Ewald real-space cutoff 12 A,
# precision 1e-6, one million ghost insertions, seed 42.
#
# Adapted from kUPS's own examples/mcmc_widom.yaml (commit e183c9a): the host starts and stays
# empty (init_adsorbates: [0], no displacement moves), so the reported henry_coefficient is the
# zero-loading value PureAdsorb's widom() also computes. num_widom_per_cycle * num_cycles =
# 500 * 2000 = 1_000_000. Input files are referenced by absolute path under kUPS's own examples
# directory rather than copied, since nanoargs resolves !import relative to this file's
# directory and cif_file relative to the process's working directory.
adsorbates:
  - !import ["/home/el_oso/src/kups/examples/adsorbate/co2.yaml"]

hosts:
  - cif_file: /home/el_oso/src/kups/examples/host/RUBTAK.cif
    pressure: 100_000 # Pa (1 bar); irrelevant to a Widom-only run with no exchange moves
    temperature: 298.15 # K
    init_adsorbates: [0]
    cell_replication: 3

lj: !import ["/home/el_oso/src/kups/examples/lennard_jones/trappe.yaml"]

ewald:
  real_cutoff: 12.0
  precision: 1.e-6

run:
  out_file: kups_widom_reference.h5
  num_cycles: 2000
  num_warmup_cycles: 0
  num_displacements_per_cycle: 0
  num_widom_per_cycle: 500
  translation_prob: 0.333
  rotation_prob: 0.333
  reinsertion_prob: 0.333
  seed: 42

max_num_adsorbates: 200
